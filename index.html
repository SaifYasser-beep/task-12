<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shop Management</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>

   <div class="container">
       <div class="input-group-name">
          <label>Phone Name</label>
          <input type="text" id="phoneName" placeholder="Enter Phone Name">
       </div>

       <div class="input-group-price">
          <label>Price</label>
          <input type="number" id="phonePrice" placeholder="Enter Price">
       </div>

       <div class="input-group-price">
          <label>Quantity</label>
          <input type="number" id="phoneCount" placeholder="Enter Quantity">
       </div>

       <button id="submitBtn" onclick="addOrUpdatePhone()">Enter Phone</button>

       <table>
           <thead>
               <tr>
                   <th>#</th>
                   <th>Mobile Name</th>
                   <th>Price</th>
                   <th>Quantity</th>
                   <th>Edit</th>
                   <th>Delete</th>
               </tr>
           </thead>
           <tbody id="tableBody">
           </tbody>
       </table>
   </div>

   <script src="./index.js"></script>
</body>
</html>
